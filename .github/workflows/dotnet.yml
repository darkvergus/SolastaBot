name: .NET

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore SolastaBot.slnx
      - run: dotnet build SolastaBot.slnx --no-restore --configuration Release
      - run: dotnet run --project SolastaBot.Tests/SolastaBot.Tests.csproj --no-build --configuration Release
